; Smart Launcher — ESP32 WROVER-E PlatformIO config
; Board: Freenove ESP32-WROVER
; Framework: Arduino
;
; Ported from the original ESP32-S3 target after real-hardware bring-up
; found: (1) GPIO 9/10 are permanently reserved for flash+PSRAM on WROVER
; modules and can never be regular GPIO, (2) GPIO 2 is a strapping pin
; that boot-loops if driven as OUTPUT, (3) the board profile must be the
; Freenove WROVER definition (not a generic dev board) or PSRAM ends up
; misconfigured. See PROJECT_HANDOFF.md for the full bisection history.

[env:esp32wrover]
platform                  = espressif32
board                     = freenove_esp32_wrover
framework                 = arduino
board_build.partitions    = partitions_custom.csv
board_build.filesystem    = littlefs
board_build.f_flash       = 80000000L
board_build.flash_mode    = qio
monitor_speed             = 115200
monitor_filters           = esp32_exception_decoder, time
upload_speed              = 921600

; --- Libraries ---
; FastLED removed — status LED is a plain 2-pin LED on this board, not a
; WS2812. See StateMachine.cpp for the blink-pattern-based state display.
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.0.0

; --- Build flags ---
; PIN_SERVO_A/B, PIN_LIMIT_A/B, PIN_STATUS_LED all changed from the
; original ESP32-S3 values — see PROJECT_HANDOFF.md "Round 2/3 fixes" for
; why each one moved.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DPIN_GNSS_RX=4
    -DPIN_GNSS_TX=5
    -DPIN_MAVLINK_RX=16
    -DPIN_MAVLINK_TX=17
    -DPIN_SERVO_A=12
    -DPIN_SERVO_B=13
    -DPIN_LIMIT_A=32
    -DPIN_LIMIT_B=33
    -DPIN_ARM_BUTTON=0
    -DPIN_STATUS_LED=22
