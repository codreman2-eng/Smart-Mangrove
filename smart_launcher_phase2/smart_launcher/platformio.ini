; Smart Launcher — ESP32-S3 PlatformIO config
; Board: ESP32-S3-DevKitC-1 N8R8
; Framework: Arduino

[env:esp32s3]
platform                  = espressif32
board                     = esp32-s3-devkitc-1
framework                 = arduino
board_build.partitions    = partitions_custom.csv
board_build.filesystem    = littlefs
monitor_speed             = 115200
monitor_filters           = esp32_exception_decoder, time
upload_speed              = 921600

; --- Libraries ---
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.0.0
    fastled/FastLED @ ^3.6.0

; --- Build flags ---
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_GNSS_RX=4
    -DPIN_GNSS_TX=5
    -DPIN_MAVLINK_RX=16
    -DPIN_MAVLINK_TX=17
    -DPIN_SERVO_A=18
    -DPIN_SERVO_B=8
    -DPIN_LIMIT_A=9
    -DPIN_LIMIT_B=10
    -DPIN_ARM_BUTTON=0
    -DPIN_STATUS_LED=48
